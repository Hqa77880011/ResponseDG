name: Code
on: [push, pull_request, workflow_dispatch]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: python -m compileall -q .
      - run: python -c "import responsedg"
