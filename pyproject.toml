[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "responsedg"
version = "0.1.0"
description = "ResponseDG implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "Pillow>=10"]

[project.scripts]
responsedg = "responsedg:main"

[tool.setuptools]
py-modules = ["prepare", "responsedg"]
